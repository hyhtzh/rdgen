name: Dart Check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'rustdesk ref to analyze against'
        required: false
        default: 'master'
        type: string

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Checkout rustdesk
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: ${{ inputs.ref }}
          path: src
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Copy pages and apply patch
        run: |
          cp patches/client_home_page.dart src/flutter/lib/desktop/pages/
          cp patches/screen_wall_page.dart src/flutter/lib/desktop/pages/
          cp patches/file_transfer_page.dart src/flutter/lib/desktop/pages/
          cp patches/simple_host_page.dart src/flutter/lib/desktop/pages/
          cp patches/settings_page.dart src/flutter/lib/desktop/pages/
          cp patches/address_book_page.dart src/flutter/lib/desktop/pages/
          cp patches/agent_page.dart src/flutter/lib/desktop/pages/
          cp patches/license_page.dart patches/license_client.dart src/flutter/lib/desktop/pages/
          python3 patches/patch_client_ui.py src
          python3 patches/patch_license.py src desktop
          python3 patches/patch_toolbar_eye.py src
          python3 patches/patch_wall_canvas.py src
          python3 patches/patch_default_view_only.py src
          grep -n "ClientHomePage" src/flutter/lib/main.dart

      - name: Parse check patched native files
        working-directory: src/flutter
        run: |
          # model.dart / remote_page.dart 依赖构建期生成的 generated_bridge.dart，
          # 单独 analyze 会报一堆 uri_does_not_exist，所以只做语法解析检查。
          set +e
          dart format -o none lib/models/model.dart lib/desktop/pages/remote_page.dart
          echo "parse done"

      - name: Pub get
        working-directory: src/flutter
        run: flutter pub get || true

      - name: Analyze new pages
        working-directory: src/flutter
        run: |
          set +e
          flutter analyze lib/desktop/pages/client_home_page.dart lib/desktop/pages/screen_wall_page.dart lib/desktop/pages/file_transfer_page.dart lib/desktop/pages/simple_host_page.dart lib/desktop/pages/settings_page.dart lib/desktop/pages/address_book_page.dart lib/desktop/pages/license_page.dart lib/desktop/pages/license_client.dart lib/desktop/pages/agent_page.dart lib/utils/multi_window_manager.dart lib/desktop/widgets/remote_toolbar.dart lib/main.dart lib/consts.dart 2>&1 | tee /tmp/analyze.log
          echo "---- errors only ----"
          grep -E "^\s+(error|warning)" /tmp/analyze.log | head -80
          exit 0
